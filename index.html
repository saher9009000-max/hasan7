<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b6b5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>بوصلة احترافية</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="app-header">
    <div class="header-content">
      <h1>🧭 بوصلة احترافية</h1>
      <button id="menuBtn" class="icon-btn" aria-label="قائمة">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="5" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="19" r="2.2" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="next-prayer">
      <div class="next-label">الصلاة القادمة</div>
      <div class="next-name" id="nextName">—</div>
      <div class="next-time" id="nextTime">—</div>
      <div class="countdown" id="countdown">—</div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="times">المواقيت</button>
    <button class="tab" data-tab="qibla">القبلة</button>
    <button class="tab" data-tab="settings">الإعدادات</button>
  </nav>

  <main>
    <section id="tab-times" class="tab-content active">
      <div class="date-row">
        <div id="gregorianDate"></div>
        <div id="hijriDate"></div>
      </div>
      <ul id="prayerList" class="prayer-list"></ul>
    </section>

    <section id="tab-qibla" class="tab-content">
      <div class="compass-wrap">
        <div class="compass" id="compass">
          <div class="compass-ring"></div>
          <div class="device-fwd"></div>
        </div>
        <div class="qibla-info">
          <div>زاوية القبلة: <strong id="qiblaAngle">—</strong></div>
          <div>اتجاه الجهاز: <strong id="headingVal">—</strong></div>
          <div id="alignMsg" class="align-msg"></div>
        </div>
      </div>
    </section>

    <section id="tab-settings" class="tab-content"></section>
  </main>

  <div id="sheet" class="sheet">
    <div class="sheet-content">
      <div class="sheet-handle"></div>
      <button data-action="sync">🔄 تزامن الوقت والمنطقة الزمنية</button>
      <button data-action="locate">📍 تحديث الموقع</button>
      <button data-action="theme">🎨 تبديل الثيم</button>
      <button data-action="notifications">🔔 إعدادات الإشعارات</button>
      <button data-action="backup">💾 تصدير نسخة احتياطية</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/adhan@4.4.3/lib/bundles/adhan.umd.min.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
